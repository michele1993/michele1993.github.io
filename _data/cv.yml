- title: Experience
  type: time_table
  contents:
    - title: <a href="https://www.crg.eu/en"> Senior Postdoctoral Associate in Protein Language Models & Generative Protein Design.</a>
      institution: Centre for Genomic Regulation (Ferruz group), Spain.
      year: Current
      description:
        - Led design and execution of large-scale pre-training of protein language models (ProtGPT3 project, up to 10B parameters), across multi-node, multi-GPU systems (40+ GPUs) using PyTorch Distributed, DeepSpeed, and Hugging Face Accelerate.
        - Led post-training (SFT, RLHF) of large protein and genomic (e.g., evo2) language models for target bio properties.
        - Developed large-scale evaluation pipelines for protein language model generations, integrating structure prediction (AlphaFold, ESMFold, Boltz), evolutionary consistency checks (HMM profiles, MSA-based metrics), and sequence-level scoring (ESM, ProteinMPNN) to assess structural validity and design quality at scale.
    - title: Visiting Postdoctoral Research Associate in Neuroscience and Machine Learning.
      institution: <a href="https://www.dpag.ox.ac.uk/team/michele-garibbo">University of Oxford</a>, UK, under Rui Ponte Costa.
      year: 2024
      description:
        - April - December 2024.
    - title: Visiting PhD Student in Neuroscience and Machine Learning.
      institution: University of Oxford, UK.
      year: 2023 - 2024
    - title: Teaching Assistant.
      institution: University of Bristol, UK.
      year: 2021 - 2022
      description:
        - Engineering Mathematics 1, Computational Neuroscience.
    - title: Paid Student Assistantship in Deep Reinforcement Learning and Human Vision.
      institution: Maastricht University, Netherlands.
      year: 2019
      description:
        - Feb - April 2019. Working on a well-known deep RL vision architecture to subsequently model human gaze (<a href="https://github.com/michele1993/RAM_TensorFlow">repo</a>).
    - title: Assistant Data Analyst.
      institution: Annex Clinical, New York, USA.
      year: 2016
      description:
        - Feb - April 2016. Analysis of a large clinical dataset to investigate the relation between anhedonia and depression in relation to clinical trial drop-out (see <a href="https://www.appliedclinicaltrialsonline.com/view/leverage-site-owned-tech-improve-trial-retention">article</a>).

